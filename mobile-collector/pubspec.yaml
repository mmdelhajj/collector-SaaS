name: isp_collector
description: Field collector app for the ISP SaaS platform.
publish_to: "none"
version: 1.0.0+15
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3
  retrofit: 4.4.2

  # Secure storage for the bearer token
  flutter_secure_storage: ^9.2.2

  # Local DB for offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Background sync
  workmanager: ^0.9.0+3

  # Maps + location
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Embedded admin WebView for office roles (owner/admin/manager/accountant/
  # support). Lets them use the full responsive web admin from inside the
  # app without rebuilding 17 admin sections natively.
  webview_flutter: ^4.10.0

  # Camera + signature
  image_picker: ^1.1.2
  signature: ^5.5.0

  # i18n
  intl: ^0.20.2

  # Misc UI
  go_router: ^14.1.4
  fluttertoast: ^8.2.6
  share_plus: ^10.1.4

  # Bluetooth thermal printer (classic SPP — 58/80mm mini printers)
  print_bluetooth_thermal: ^1.1.0
  esc_pos_utils_plus: ^2.0.4

  # External actions: tel:, wa.me, geo: maps
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  riverpod_generator: ^2.4.0
  build_runner: ^2.4.10
  retrofit_generator: 9.1.7
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.png
