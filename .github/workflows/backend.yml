name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: postgres
          POSTGRES_DB: isp_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, bcmath, gd, intl, zip, curl, sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (format check)
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Pest (incl. tenant isolation tests)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: isp_saas_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        shell: bash {0} # disable default `set -e -o pipefail` so grep no-match doesn't kill our diagnostic
        run: |
          cp .env.example .env || { echo "::error::cp .env.example failed"; exit 1; }
          php artisan key:generate || { echo "::error::key:generate failed"; exit 1; }
          php artisan migrate --force 2>&1 | tee /tmp/migrate.log
          MIGRATE_EXIT=${PIPESTATUS[0]}
          if [ "$MIGRATE_EXIT" -ne 0 ]; then
            tail_msg=$(tail -40 /tmp/migrate.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=migration failed::$tail_msg"
            exit "$MIGRATE_EXIT"
          fi

          ./vendor/bin/pest --colors=never 2>&1 | tee /tmp/pest.log
          PEST_EXIT=${PIPESTATUS[0]}

          if [ "$PEST_EXIT" -ne 0 ]; then
            # Pull the FAILED block from pest output (everything between the
            # first "FAILED" or "FAIL" line and the "Tests:" summary). Encode
            # newlines as %0A so the whole thing fits in one annotation,
            # which we can fetch via the public check-runs/annotations API
            # without admin auth.
            tail_msg=$(tail -120 /tmp/pest.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=pest failure (last 120 lines)::$tail_msg"

            ext_msg=$(php -m | sort | tr '\n' ',' | sed 's/,$//')
            echo "::error title=php extensions::$ext_msg"
          fi

          exit "$PEST_EXIT"
