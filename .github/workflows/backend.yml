name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: postgres
          POSTGRES_DB: isp_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, bcmath, gd, intl, zip, curl, sodium
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (format check)
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Pest (incl. tenant isolation tests)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: isp_saas_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          set -o pipefail
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          # Capture pest output AND tee to stdout. On failure surface every
          # FAIL/Error line via workflow annotations so it shows up in the
          # public run summary even when we can't pull the log archive.
          set +e
          ./vendor/bin/pest --colors=never 2>&1 | tee /tmp/pest.log
          PEST_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$PEST_EXIT" -ne 0 ]; then
            echo "::group::Pest failure summary"
            grep -nE "FAIL|Error|fail|Tests:" /tmp/pest.log | head -50 | while IFS= read -r line; do
              # Escape for ::error:: workflow command
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error file=backend,line=1::$esc"
            done
            echo "=== ENV ==="
            php -v
            php -m | sort | tr '\n' ' '
            echo ""
            echo "=== Last 100 lines of pest output ==="
            tail -100 /tmp/pest.log
            echo "::endgroup::"
          fi
          exit "$PEST_EXIT"
