name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

jobs:
  trivy:
    name: Dependency & secret scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    # Non-blocking until findings are triaged. The full audit-and-fix pass
    # already addressed the high-impact items (RADIUS auth, dual-currency,
    # secret encryption, etc.); Semgrep's `auto` config produces a long tail
    # of style-class flags that we'd rather review and rule out one by one.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: p/owasp-top-ten p/php-laravel p/typescript p/react
